#
# MSYS2 UCRT64 + MS-MPI portable VASP testsuite config (FAST category).
# Mirrors upstream fast.conf: VASP_TESTSUITE_RUN_FAST=Y
# Copied into the extracted VASP testsuite/ at run time by
# toolchain/run_testsuite.sh — do not commit licensed testsuite trees.
#
# Expects the runner to export (absolute paths):
#   VASP_PORTABLE_BIN   — directory with mpiexec.exe and vasp_*.exe
# Optional:
#   VASP_MPIEXEC        — mpiexec path (default: $VASP_PORTABLE_BIN/mpiexec.exe)
#   VASP_TESTSUITE_NRANKS — MPI ranks (default: 4)
#
nranks="${VASP_TESTSUITE_NRANKS:-4}"
BIN="${VASP_PORTABLE_BIN:?VASP_PORTABLE_BIN must be set by run_testsuite.sh}"
MPIEXEC="${VASP_MPIEXEC:-${BIN}/mpiexec.exe}"

# Pure CPU / MS-MPI: one OpenMP thread per rank (matches portable run.bat).
mpi="-n ${nranks} -env OMP_NUM_THREADS 1 -env OPENBLAS_NUM_THREADS 1"

export VASP_TESTSUITE_EXE_STD="${MPIEXEC} ${mpi} ${BIN}/vasp_std.exe"
export VASP_TESTSUITE_EXE_GAM="${MPIEXEC} ${mpi} ${BIN}/vasp_gam.exe"
export VASP_TESTSUITE_EXE_NCL="${MPIEXEC} ${mpi} ${BIN}/vasp_ncl.exe"

# Upstream fast.conf semantics: FAST category only.
export VASP_TESTSUITE_RUN_FAST=Y
